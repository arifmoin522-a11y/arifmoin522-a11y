{% load core_tags %}
<nav class="sidebar" id="sidebar" aria-label="Main navigation">
  <ul class="side-list">
    {% for item in nav_modules %}
      <li>
        <a class="side-item{% if request.path == item.url %} is-active{% endif %}"
           href="{{ item.url }}"
           {% if request.path == item.url %}aria-current="page"{% endif %}>
          {% icon item.icon %}
          <span class="side-label">{{ item.label }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
  <div class="side-foot" data-sidebar-foot>
    <button type="button" class="side-item" data-sidebar-collapse aria-label="Collapse sidebar">
      <span data-icon-collapse>{% icon "arrow_forward" %}</span>
      <span class="side-label">Collapse</span>
    </button>
  </div>
</nav>
{% comment %}Mobile drawer scrim{% endcomment %}
<div class="scrim" data-sidebar-scrim hidden></div>
