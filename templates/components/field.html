{% comment %}Form field row: {% include "components/field.html" with field=form.foo %}{% endcomment %}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="field-hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
