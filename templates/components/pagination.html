{% comment %}Pagination for a Django Page object: pass page=this_page{% endcomment %}
{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  <span class="page-info">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  <div class="page-buttons">
    {% if page.has_previous %}
      <a class="button button-tonal" href="?{% if q %}q={{ q }}&amp;{% endif %}page={{ page.previous_page_number }}">Previous</a>
    {% endif %}
    {% if page.has_next %}
      <a class="button button-tonal" href="?{% if q %}q={{ q }}&amp;{% endif %}page={{ page.next_page_number }}">Next</a>
    {% endif %}
  </div>
</nav>
{% endif %}
